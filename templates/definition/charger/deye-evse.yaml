template: deye-evse
products:
  - brand: Deye
    description:
      generic: SUN-EVSE11K01/22K01
requirements:
  description:
    de: |
      Die Wallbox wird über ihren eingebauten Solarman-Logger angesprochen.
      Benötigt werden die IP-Adresse der Wallbox und die Seriennummer des Loggers.
      Beides steht in der Weboberfläche der Wallbox unter "Geräteinformationen".

      Die Wallbox kennt keine Stromvorgabe, sondern nur eine Ladeleistung. evcc
      rechnet die Stromvorgabe anhand von Phasenzahl und Netzspannung um.

      Zum Abschalten wird die kleinste Ladeleistung gesetzt, nicht 0 W. Das Schreiben
      einer 0 löst in manchen Firmwareständen einen Fehlerzustand aus.
    en: |
      The charger is accessed through its built-in Solarman data logger. The IP
      address of the charger and the serial number of the logger are required.
      Both are shown in the charger's web interface under "device information".

      The charger has no current setting, only a charge power. evcc converts the
      current limit using the number of phases and the grid voltage.

      Disabling writes the minimum charge power instead of 0 W. Writing 0 puts
      some firmware versions into a fault state.
params:
  - name: host
    description:
      de: IP-Adresse der Wallbox
      en: IP address of the charger
    required: true
    example: 192.168.0.10
  - name: port
    description:
      de: Port
      en: Port
    type: int
    default: 8899
    advanced: true
  - name: serial
    description:
      de: Logger-Seriennummer
      en: Logger serial number
    help:
      de: Steht in der Weboberfläche der Wallbox unter "Geräteinformationen"
      en: Shown in the charger web interface under "device information"
    type: int
    required: true
    example: 1234567890
  - name: id
    description:
      de: Modbus ID
      en: Modbus ID
    type: int
    default: 3
    advanced: true
  - name: phases
    description:
      de: Angeschlossene Phasen
      en: Connected phases
    type: int
    default: 3
    required: true
  - name: voltage
    description:
      de: Netzspannung
      en: Grid voltage
    type: int
    default: 230
    advanced: true
  - name: minpower
    description:
      de: Kleinste Ladeleistung
      en: Minimum charge power
    help:
      de: Wird beim Abschalten geschrieben. Unterhalb dieses Werts lädt die Wallbox nicht.
      en: Written when disabling. The charger does not charge below this value.
    type: int
    unit: W
    default: 1000
    advanced: true
render: |
  type: custom
  # vehicle state from the status word combined with the charge power. The low
  # seven bits carry the state, observed on a SUN-EVSE11K01:
  #   bit 0 (0x01) no vehicle
  #   bit 3 (0x08) vehicle connected, not charging (e.g. battery full)
  #   bit 5 (0x20) vehicle connected, ready or charging
  # charging is derived from the power, since the status word does not
  # distinguish a connected from a charging vehicle
  status:
    source: go
    in:
      - name: state
        type: int
        config:
          source: modbus
          uri: {{ joinHostPort .host .port }}
          serial: {{ .serial }}
          id: {{ .id }}
          register:
            address: 57 # EV status word
            type: holding
            decode: uint16
      - name: power
        type: int
        config:
          source: modbus
          uri: {{ joinHostPort .host .port }}
          serial: {{ .serial }}
          id: {{ .id }}
          register:
            address: 38 # power L1
            type: holding
            decode: uint16
    script: |
      res := "A"
      if state & 0x28 != 0 {
        res = "B"
        if power > 0 {
          res = "C"
        }
      }
      res
  power:
    source: calc
    add:
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      serial: {{ .serial }}
      id: {{ .id }}
      register:
        address: 38 # power L1
        type: holding
        decode: uint16
      scale: 10
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      serial: {{ .serial }}
      id: {{ .id }}
      register:
        address: 39 # power L2
        type: holding
        decode: uint16
      scale: 10
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      serial: {{ .serial }}
      id: {{ .id }}
      register:
        address: 40 # power L3
        type: holding
        decode: uint16
      scale: 10
  enabled: # disabled while the setpoint is at the minimum charge power
    source: go
    in:
      - name: setpoint
        type: int
        config:
          source: modbus
          uri: {{ joinHostPort .host .port }}
          serial: {{ .serial }}
          id: {{ .id }}
          register:
            address: 18 # charge power setpoint
            type: holding
            decode: uint16
    script: setpoint > {{ .minpower }}
  # the device ignores write single (fn 6) and only answers write multiple (fn 16),
  # same as the Deye inverters
  enable:
    source: ifelse
    if: # enabling writes nothing: evcc sets the current limit first, which is the
        # same register, so writing here would immediately overwrite it again
      source: convert
      convert: bool2int
      set:
        source: sleep
        duration: 0s
    else: # disabling drops the limit below what the charger acts on
      source: convert
      convert: bool2int
      set:
        source: const
        value: {{ .minpower }}
        set:
          source: modbus
          uri: {{ joinHostPort .host .port }}
          serial: {{ .serial }}
          id: {{ .id }}
          register:
            address: 18 # charge power setpoint
            type: writemultiple
            decode: uint16
  maxcurrent: # the charger takes watts, not amps
    source: go
    script: |
      watt := maxcurrent * {{ .voltage }} * {{ .phases }}
      if watt < {{ .minpower }} {
        watt = {{ .minpower }}
      }
      watt
    out:
      - name: watt
        type: int
        config:
          source: modbus
          uri: {{ joinHostPort .host .port }}
          serial: {{ .serial }}
          id: {{ .id }}
          register:
            address: 18 # charge power setpoint
            type: writemultiple
            decode: uint16
